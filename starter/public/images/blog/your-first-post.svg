<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6f7f9"/>
  <text x="80" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#2f5bd3">GETTING STARTED</text>
  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#1d2129">
    <tspan x="80" y="290">Your first</tspan>
    <tspan x="80" y="368">post</tspan>
  </text>
  <text x="80" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#5b6270">Write it, date it, publish it.</text>
  <g transform="translate(640 90)">
    <rect width="480" height="450" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect width="480" height="56" rx="18" fill="#eaf0fd"/>
    <rect y="38" width="480" height="18" fill="#eaf0fd"/>
    <text x="28" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#2f5bd3">your-first-post.md</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#1d2129">
      <text x="28" y="104" fill="#5b6270">---</text>
      <text x="28" y="140"><tspan fill="#2f5bd3">title:</tspan> Your first post</text>
      <text x="28" y="176"><tspan fill="#2f5bd3">date:</tspan> 2026-10-29</text>
      <text x="28" y="212"><tspan fill="#2f5bd3">image:</tspan> /images/blog/...</text>
      <text x="28" y="248" fill="#5b6270">---</text>
    </g>
    <rect x="28" y="286" width="300" height="16" rx="8" fill="#1d2129" opacity="0.8"/>
    <rect x="28" y="326" width="424" height="12" rx="6" fill="#e3e6eb"/>
    <rect x="28" y="354" width="400" height="12" rx="6" fill="#e3e6eb"/>
    <rect x="28" y="382" width="410" height="12" rx="6" fill="#e3e6eb"/>
    <rect x="28" y="410" width="260" height="12" rx="6" fill="#e3e6eb"/>
