name: Publish-day email

# Emails your subscribers when a new post goes live. Runs right after
# "Weekly publish" finishes, waits for the new post to appear on the site,
# then creates a Klaviyo campaign for it, scheduled for 09:15 in your time
# zone (both set in src/site.config.mjs). On a week with no new post it
# ends without sending anything.
#
# It starts from the publish workflow, with no clock time of its own. A
# second fixed time was the first design, and it failed: scheduled runs can
# start an hour or more late, so any fixed time either ran before the post
# existed or after the send time. Starting when the publish run finishes
# removes the guess.
#
# A normal publish day, New York time:
#   05:37  Weekly publish asks Netlify to build
#   05:45  the build finishes and the post is live
#   05:45  this workflow finds the post and schedules the email
#   09:15  Klaviyo sends it
#
# When a late start eats all that room, the email goes out at the next
# quarter hour the same day. If a post went live and no email could be
# scheduled, the run fails and shows red in the Actions tab.
#
# Needs 1 secret: KLAVIYO_PRIVATE_KEY. Optional: LIST_ID, if you would rather
# keep the list ID out of src/site.config.mjs. See README, step 7.

on:
  workflow_run:
    workflows: ["Weekly publish"]
    types: [completed]

  # The "Run workflow" button. Dry run is on by default: it shows the plan in
  # the log and creates nothing in Klaviyo.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the plan, create nothing in Klaviyo"
        type: boolean
        default: true

# Never 2 at once, so 2 runs on the same day cannot both create a campaign.
concurrency:
  group: blog-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip the email when the publish step itself failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm install` needed: the script uses only what comes with Node.
      - name: Create and schedule the email
        env:
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          LIST_ID: ${{ secrets.LIST_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/blog-email/send.mjs --dry-run
          else
            node scripts/blog-email/send.mjs
          fi
